spring.application.name=travelo_backend

# URL de connexion à MySQL
# "travelo-database" = hostname DNS du conteneur MySQL dans le réseau Docker
spring.datasource.url=jdbc:mysql://travelo-database:3306/travelo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=chaima2003

# JPA / Hibernate
# ddl-auto=update : Hibernate crée/met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Suppression du dialecte explicite (deprecated depuis Hibernate 6.6)
# Hibernate détecte automatiquement MySQL8Dialect

# Désactiver open-in-view pour éviter le warning
spring.jpa.open-in-view=false
