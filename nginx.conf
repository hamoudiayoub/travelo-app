worker_processes auto;
events {
    worker_connections 1024;
}

# 
http {
    # Définition des upstreams (noms DNS des services Swarm)
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    # Règle pour le Frontend : frontend.travelo.local
    server {
        listen 80;
        server_name frontend.travelo.local;

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Règle pour le Backend : backend.travelo.local
    server {
        listen 80;
        server_name backend.travelo.local;

        location / {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


stream {
    upstream mysql_upstream {
        server travelo-database:3306;
    }

    server {
        listen 3306;
        proxy_pass mysql_upstream;
    }
}